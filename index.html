<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enes Deva Terminal Simulator</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            padding: 20px;
            border-radius: 5px;
        }
        .header {
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
        }
        .log-area {
            height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        button {
            background-color: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">ENES DEVA // TERMINAL SIMULATOR v1.0</div>
    <div class="log-area" id="logs">
        > Sistem başlatılıyor...<br>
        > Bağlantı güvenli.<br>
        > İşlem başlatmak için aşağıdaki butona basın.<br>
    </div>
    <button onclick="runSimulation()">SİMÜLASYONU BAŞLAT</button>
</div>

<script>
    function runSimulation() {
        const logs = document.getElementById('logs');
        const messages = [
            "> Sunuculara erişim sağlanıyor...",
            "> Ağ protokolleri taranıyor...",
            "> Veri paketleri simüle ediliyor...",
            "> İŞLEM TAMAMLANDI: Şaka başarıyla yüklendi! 😊"
        ];
        
        let index = 0;
        logs.innerHTML = "";
        
        const interval = setInterval(() => {
            if (index < messages.length) {
                logs.innerHTML += messages[index] + "<br>";
                logs.scrollTop = logs.scrollHeight;
                index++;
            } else {
                clearInterval(interval);
            }
        }, 800);
    }
</script>

</body>
</html>
